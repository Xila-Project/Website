name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  documentation:
    name: Documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup | Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup | Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Setup | Install dependencies
        run: npm ci

      - name: Diagnostic | Display formatting diff
        run: |
          npx prettier --write .vitepress/navigation.ts src/explanation/architecture/libraries/verification.md src/explanation/package-management.md src/how-to/submit-package.md src/reference/package-format.md
          git diff -- .vitepress/navigation.ts src/explanation/architecture/libraries/verification.md src/explanation/package-management.md src/how-to/submit-package.md src/reference/package-format.md

      - name: Check | Documentation
        run: npm run check
