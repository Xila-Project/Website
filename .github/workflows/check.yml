name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  documentation:
    name: Documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup | Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup | Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Setup | Install dependencies
        run: npm ci

      - name: Setup | Checkout source repositories for reference validation
        run: |
          git clone --quiet --depth 1 https://github.com/xila-project/core.git "$RUNNER_TEMP/xila-core"
          git clone --quiet --depth 1 https://github.com/xila-project/applications.git "$RUNNER_TEMP/xila-applications"
          git clone --quiet --depth 1 https://github.com/xila-project/platforms.git "$RUNNER_TEMP/xila-platforms"

      - name: Diagnostic | Show exact Prettier changes
        run: |
          npx prettier --write .vitepress/theme/utilities/source-reference.mjs scripts/check-docs.mjs src/explanation/development-environments.md src/how-to/setup-development.md
          git diff -- .vitepress/theme/utilities/source-reference.mjs scripts/check-docs.mjs src/explanation/development-environments.md src/how-to/setup-development.md

      - name: Check | Documentation
        env:
          XILA_CORE_PATH: ${{ runner.temp }}/xila-core
          XILA_APPLICATIONS_PATH: ${{ runner.temp }}/xila-applications
          XILA_PLATFORMS_PATH: ${{ runner.temp }}/xila-platforms
        run: npm run check
