name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  documentation:
    name: Documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Setup | Checkout documentation"
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: "Setup | Node and locked dependencies"
        uses: xila-project/workspace/.github/actions/setup-node@537d54a3aefb7c689a5cb498f55c64a6afecbbdd

      - name: "Setup | Checkout reference repositories"
        run: |
          git clone --quiet --depth 1 https://github.com/xila-project/core.git "$RUNNER_TEMP/xila-core"
          git clone --quiet --depth 1 https://github.com/xila-project/applications.git "$RUNNER_TEMP/xila-applications"
          git clone --quiet --depth 1 https://github.com/xila-project/platforms.git "$RUNNER_TEMP/xila-platforms"

      - name: "Validate | Documentation and references"
        env:
          XILA_CORE_PATH: ${{ runner.temp }}/xila-core
          XILA_APPLICATIONS_PATH: ${{ runner.temp }}/xila-applications
          XILA_PLATFORMS_PATH: ${{ runner.temp }}/xila-platforms
        run: mise exec -- npm run check
