name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  documentation:
    name: Documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup | Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup | Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Setup | Install dependencies
        run: npm ci

      - name: Debug | Show Prettier diff
        run: |
          npm exec prettier -- --write src/reference/graphics-bindings.md src/reference/shell.md src/reference/wasm-runtime.md
          git diff -- src/reference/graphics-bindings.md src/reference/shell.md src/reference/wasm-runtime.md

      - name: Check | Documentation
        run: npm run check
